name: Bot

on:
  schedule:
    - cron: "17 7 * * 1" # jeden Montag 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bot ausführen
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        run: python -m cryptocastle.bot
      - name: Zustand und Trade-Log speichern
        run: |
          git config user.name "cryptocastle-bot"
          git config user.email "cryptocastle-bot@users.noreply.github.com"
          git add state/state.json trades.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Bot-Lauf $(date -u +%Y-%m-%d)"
          git push
